[project]
name = "chat"
version = "0.1.0"
description = "Chatbot application with LangChain, ChromaDB, and Textual UI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "chromadb>=1.5.9",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pytest-asyncio>=1.4.0",
    "streamlit>=1.61.1",
    "textual-dev>=1.8.0",
    "textual[syntax]>=8.2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["ui", "ui.*", "chat", "chatbot", "config", "graph", "memory", "user"]
exclude = ["tests*", "data*", "users*"]

[project.scripts]
chatbotcli = "ui.app:main"
